name: novel_high_virulence
description: Severe novel respiratory pathogen modeled with high reproduction and elevated ICU clinical severity.
provenance:
  source: "EpiSwarm Synthetic Benchmark Suite"
  status: synthetic
  notes: "Hypothetical severe pathogen for healthcare stress testing."

transmission:
  mode: person_to_person
  r0: 3.4
  overdispersion_k: 0.12
  seasonality_amplitude: 0.15
  waning_immunity_days: 120.0

states:
  - name: S
    infectious: false
    absorbing: false
  - name: E
    infectious: false
    absorbing: false
  - name: I_asymp
    infectious: true
    relative_infectiousness: 0.60
    absorbing: false
  - name: I_symp
    infectious: true
    relative_infectiousness: 1.00
    absorbing: false
  - name: H
    infectious: true
    relative_infectiousness: 0.15
    needs:
      res_bed: 1.0
    needs_care: true
    severity_level: 1.5
    absorbing: false
  - name: ICU
    infectious: true
    relative_infectiousness: 0.05
    needs:
      res_bed: 1.0
      res_support: 1.0
    needs_care: true
    severity_level: 3.0
    absorbing: false
  - name: R
    infectious: false
    absorbing: true
  - name: D
    infectious: false
    absorbing: true

transitions:
  - from_state: E
    to_state: I_asymp
    base_probability: 0.25
    duration:
      type: gamma
      mean_days: 2.5
      sd_days: 0.8
  - from_state: E
    to_state: I_symp
    base_probability: 0.75
    duration:
      type: gamma
      mean_days: 2.5
      sd_days: 0.8
  - from_state: I_asymp
    to_state: R
    base_probability: 1.00
    duration:
      type: gamma
      mean_days: 5.0
      sd_days: 1.5
  - from_state: I_symp
    to_state: R
    base_probability: 0.82
    duration:
      type: gamma
      mean_days: 6.0
      sd_days: 2.0
  - from_state: I_symp
    to_state: H
    base_probability: 0.18
    duration:
      type: gamma
      mean_days: 5.0
      sd_days: 1.5
  - from_state: H
    to_state: R
    base_probability: 0.68
    duration:
      type: gamma
      mean_days: 8.0
      sd_days: 2.5
  - from_state: H
    to_state: ICU
    base_probability: 0.25
    duration:
      type: gamma
      mean_days: 4.0
      sd_days: 1.2
  - from_state: H
    to_state: D
    base_probability: 0.07
    duration:
      type: gamma
      mean_days: 6.0
      sd_days: 2.0
  - from_state: ICU
    to_state: R
    base_probability: 0.55
    duration:
      type: gamma
      mean_days: 10.0
      sd_days: 3.0
  - from_state: ICU
    to_state: D
    base_probability: 0.45
    duration:
      type: gamma
      mean_days: 7.0
      sd_days: 2.5

overflow:
  bed_unavailable_mortality_multiplier: 2.8
  icu_unavailable_mortality_multiplier: 4.5
