name: respiratory_generic
description: Generic respiratory pathogen modeled after aerosol/droplet transmission with age-stratified severity.
provenance:
  source: "Levin et al. 2020 (IFR anchors) & Libin et al. 2020 (SEIR parameterization)"
  status: assumed
  notes: "SEIR progression rates cited; specific overflow multipliers assumed."

transmission:
  mode: person_to_person
  r0: 2.5
  overdispersion_k: 0.16
  seasonality_amplitude: 0.10
  waning_immunity_days: 180.0

states:
  - name: S
    infectious: false
    absorbing: false
  - name: E
    infectious: false
    absorbing: false
  - name: I_asymp
    infectious: true
    relative_infectiousness: 0.50
    absorbing: false
  - name: I_symp
    infectious: true
    relative_infectiousness: 1.00
    absorbing: false
  - name: H
    infectious: true
    relative_infectiousness: 0.10
    needs:
      res_bed: 1.0
    needs_care: true
    severity_level: 1.0
    absorbing: false
  - name: ICU
    infectious: true
    relative_infectiousness: 0.05
    needs:
      res_bed: 1.0
      res_support: 1.0
    needs_care: true
    severity_level: 2.5
    absorbing: false
  - name: R
    infectious: false
    absorbing: true
  - name: D
    infectious: false
    absorbing: true

transitions:
  - from_state: E
    to_state: I_asymp
    base_probability: 0.35
    duration:
      type: gamma
      mean_days: 3.0
      sd_days: 1.0
  - from_state: E
    to_state: I_symp
    base_probability: 0.65
    duration:
      type: gamma
      mean_days: 3.0
      sd_days: 1.0
  - from_state: I_asymp
    to_state: R
    base_probability: 1.00
    duration:
      type: gamma
      mean_days: 5.0
      sd_days: 1.5
  - from_state: I_symp
    to_state: H
    base_probability: 0.045
    duration:
      type: gamma
      mean_days: 5.5
      sd_days: 2.0
    age_multipliers:
      "0-4": 0.30
      "5-18": 0.20
      "19-64": 1.00
      "65+": 4.50
    comorbidity_multipliers:
      "hypertension": 1.40
      "diabetes": 1.60
  - from_state: I_symp
    to_state: R
    base_probability: 0.955
    duration:
      type: gamma
      mean_days: 7.0
      sd_days: 2.0
  - from_state: H
    to_state: ICU
    base_probability: 0.15
    duration:
      type: gamma
      mean_days: 3.5
      sd_days: 1.5
    age_multipliers:
      "65+": 2.00
  - from_state: H
    to_state: R
    base_probability: 0.80
    duration:
      type: gamma
      mean_days: 8.0
      sd_days: 2.5
  - from_state: H
    to_state: D
    base_probability: 0.05
    duration:
      type: gamma
      mean_days: 6.0
      sd_days: 2.0
  - from_state: ICU
    to_state: D
    base_probability: 0.40
    duration:
      type: gamma
      mean_days: 7.0
      sd_days: 3.0
  - from_state: ICU
    to_state: R
    base_probability: 0.60
    duration:
      type: gamma
      mean_days: 12.0
      sd_days: 4.0

vulnerability_factors:
  - id: hypertension
    description: "Cardiovascular hypertension elevating disease severity and hospitalization odds"
    effects:
      susceptibility: 1.10
      severity_odds: 1.50
      mortality_odds: 1.35
    region_field: hypertension
  - id: respiratory_chronic
    description: "Chronic obstructive pulmonary or asthma history amplifying susceptibility and fatality"
    effects:
      susceptibility: 1.30
      severity_odds: 2.20
      mortality_odds: 1.80
    region_field: respiratory_chronic

environment_modifiers:
  household_transmission:
    persons_per_room: 0.25

unserved_outcome:
  theta_0: 0.60
  theta_sev: 0.35
  theta_care: 0.45
  theta_sup: 0.30
  theta_alt: 0.25
  theta_delay: 0.15
  ref_severity: 1.0

sanitation_sensitivity: 0.05
