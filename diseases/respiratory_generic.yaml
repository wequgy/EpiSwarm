description: Generic respiratory pathogen modeled after aerosol/droplet transmission
  with age-stratified severity.
environment_modifiers:
  household_transmission:
    persons_per_room: 0.25
name: respiratory_generic
provenance:
  notes: Calibrated to ICNARC COVID-19 Wave 1 London critical care stays and Levin
    et al. (2020) age-stratified IFR anchors.
  source: Levin et al. 2020 (IFR anchors) & ICNARC 2020 (ICU durations)
  status: sourced
sanitation_sensitivity: 0.05
states:
- absorbing: false
  infectious: false
  name: S
- absorbing: false
  infectious: false
  name: E
- absorbing: false
  infectious: true
  name: I_asymp
  relative_infectiousness: 0.5
- absorbing: false
  infectious: true
  name: I_symp
  relative_infectiousness: 1.0
- absorbing: false
  infectious: true
  name: H
  needs:
    res_bed: 1.0
  needs_care: true
  relative_infectiousness: 0.1
  severity_level: 1.0
- absorbing: false
  infectious: true
  name: ICU
  needs:
    res_bed: 1.0
    res_support: 1.0
  needs_care: true
  relative_infectiousness: 0.05
  severity_level: 2.5
- absorbing: true
  infectious: false
  name: R
- absorbing: true
  infectious: false
  name: D
transitions:
- base_probability: 0.35
  duration:
    mean_days: 3.0
    sd_days: 1.0
    type: gamma
  from_state: E
  to_state: I_asymp
- base_probability: 0.65
  duration:
    mean_days: 3.0
    sd_days: 1.0
    type: gamma
  from_state: E
  to_state: I_symp
- base_probability: 1.0
  duration:
    mean_days: 5.0
    sd_days: 1.5
    type: gamma
  from_state: I_asymp
  to_state: R
- age_multipliers:
    0-4: 0.02
    19-64: 1.0
    5-18: 0.03
    65+: 4.5
  base_probability: 0.045
  comorbidity_multipliers:
    diabetes: 1.6
    hypertension: 1.4
  duration:
    mean_days: 5.5
    sd_days: 2.0
    type: gamma
  from_state: I_symp
  to_state: H
- base_probability: 0.955
  duration:
    mean_days: 7.0
    sd_days: 2.0
    type: gamma
  from_state: I_symp
  to_state: R
- age_multipliers:
    65+: 1.0
  base_probability: 0.095
  duration:
    mean_days: 3.5
    sd_days: 1.5
    type: gamma
  from_state: H
  to_state: ICU
- base_probability: 0.8
  duration:
    mean_days: 8.0
    sd_days: 2.5
    type: gamma
  from_state: H
  to_state: R
- age_multipliers:
    65+: 4.0
  base_probability: 0.05
  duration:
    mean_days: 6.0
    sd_days: 2.0
    type: gamma
  from_state: H
  to_state: D
- age_multipliers:
    65+: 1.2
  base_probability: 0.45
  duration:
    mean_days: 11.5
    sd_days: 3.5
    type: gamma
  from_state: ICU
  to_state: D
- base_probability: 0.55
  duration:
    mean_days: 16.5
    sd_days: 4.5
    type: gamma
  from_state: ICU
  to_state: R
transmission:
  mode: person_to_person
  overdispersion_k: 0.16
  r0: 2.5
  seasonality_amplitude: 0.1
  waning_immunity_days: 180.0
unserved_outcome:
  ref_severity: 1.0
  theta_0: 0.6
  theta_alt: 0.25
  theta_care: 0.45
  theta_delay: 0.15
  theta_sev: 0.35
  theta_sup: 0.3
vulnerability_factors:
- description: Cardiovascular hypertension elevating disease severity and hospitalization
    odds
  effects:
    mortality_odds: 1.35
    severity_odds: 1.5
    susceptibility: 1.1
  id: hypertension
  region_field: hypertension
- description: Chronic obstructive pulmonary or asthma history amplifying susceptibility
    and fatality
  effects:
    mortality_odds: 1.8
    severity_odds: 2.2
    susceptibility: 1.3
  id: respiratory_chronic
  region_field: respiratory_chronic
