name: influenza_generic
description: Generic influenza-like illness with rapid viral shedding, short generation time, and age-stratified pediatric severity.
provenance:
  source: "Libin et al. 2020 / Ferguson et al. 2006 parameters"
  status: assumed
  notes: "Influenza benchmark parameterization."

transmission:
  mode: person_to_person
  r0: 1.60
  overdispersion_k: 0.80
  seasonality_amplitude: 0.20
  waning_immunity_days: 120.0

states:
  - name: S
    infectious: false
    absorbing: false
  - name: E
    infectious: false
    absorbing: false
  - name: I
    infectious: true
    relative_infectiousness: 1.00
    absorbing: false
  - name: H
    infectious: true
    relative_infectiousness: 0.10
    needs_bed: general
    needs_oxygen: true
    absorbing: false
  - name: R
    infectious: false
    absorbing: true
  - name: D
    infectious: false
    absorbing: true

transitions:
  # E -> I (1.5 days mean latent period)
  - from_state: E
    to_state: I
    base_probability: 1.00
    duration:
      type: gamma
      mean_days: 1.5
      sd_days: 0.5

  # I -> H (1.5% hospitalization)
  - from_state: I
    to_state: H
    base_probability: 0.015
    duration:
      type: gamma
      mean_days: 2.5
      sd_days: 0.8
    age_multipliers:
      "0-4": 2.0
      "65+": 3.0

  # I -> R (98.5% recover directly)
  - from_state: I
    to_state: R
    base_probability: 0.985
    duration:
      type: gamma
      mean_days: 3.5
      sd_days: 1.0

  # H -> R (96% in-hospital recovery)
  - from_state: H
    to_state: R
    base_probability: 0.96
    duration:
      type: gamma
      mean_days: 5.0
      sd_days: 1.5

  # H -> D (4% in-hospital fatality)
  - from_state: H
    to_state: D
    base_probability: 0.04
    duration:
      type: gamma
      mean_days: 4.0
      sd_days: 1.0

overflow:
  bed_unavailable_mortality_multiplier: 1.8
  icu_unavailable_mortality_multiplier: 2.5
  oxygen_unavailable_mortality_multiplier: 2.0
  compliance_mortality_benefit: 0.90
  non_compliance_mortality_penalty: 1.20

sanitation_sensitivity: 0.02
