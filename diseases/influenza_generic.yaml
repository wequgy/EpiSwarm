name: influenza_generic
description: Generic influenza-like illness with rapid viral shedding, short generation time, and age-stratified pediatric severity.
provenance:
  source: "Libin et al. 2020 / Ferguson et al. 2006 parameters"
  status: assumed
  notes: "Influenza benchmark parameterization."

transmission:
  mode: person_to_person
  r0: 1.60
  overdispersion_k: 0.80
  seasonality_amplitude: 0.20
  waning_immunity_days: 120.0

states:
  - name: S
    infectious: false
    absorbing: false
  - name: E
    infectious: false
    absorbing: false
  - name: I
    infectious: true
    relative_infectiousness: 1.00
    absorbing: false
  - name: H
    infectious: true
    relative_infectiousness: 0.10
    needs:
      res_bed: 1.0
    needs_care: true
    severity_level: 1.0
    absorbing: false
  - name: R
    infectious: false
    absorbing: true
  - name: D
    infectious: false
    absorbing: true

transitions:
  - from_state: E
    to_state: I
    base_probability: 1.00
    duration:
      type: gamma
      mean_days: 1.5
      sd_days: 0.5

  - from_state: I
    to_state: H
    base_probability: 0.015
    duration:
      type: gamma
      mean_days: 2.5
      sd_days: 0.8
    age_multipliers:
      "0-4": 2.0
      "65+": 3.0

  - from_state: I
    to_state: R
    base_probability: 0.985
    duration:
      type: gamma
      mean_days: 3.5
      sd_days: 1.0

  - from_state: H
    to_state: R
    base_probability: 0.96
    duration:
      type: gamma
      mean_days: 5.0
      sd_days: 1.5

  - from_state: H
    to_state: D
    base_probability: 0.04
    duration:
      type: gamma
      mean_days: 4.0
      sd_days: 1.0

vulnerability_factors:
  - id: pediatric_asthma
    description: "Pediatric respiratory condition predisposing to acute influenza exacerbations"
    effects:
      susceptibility: 1.25
      severity_odds: 1.80
      mortality_odds: 1.20
    region_field: pediatric_asthma

environment_modifiers:
  household_transmission:
    persons_per_room: 0.10

unserved_outcome:
  theta_0: 0.40
  theta_sev: 0.25
  theta_care: 0.35
  theta_sup: 0.25
  theta_alt: 0.20
  theta_delay: 0.10
  ref_severity: 1.0

sanitation_sensitivity: 0.02
