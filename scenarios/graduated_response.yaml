name: graduated_response
horizon_days: 90
scale_agents: 50000
random_seed: 42
behavior_mode: rule

seeding:
  area_id: A01
  seed_all_areas: false
  initial_cases_per_area: 30
  seeded_state: I_symp

interventions:
  - name: public_correction_campaign
    measure_type: correction_campaign
    area_id: ALL
    start_day: 3
    end_day: 90
    stringency: 0.60
    cost_per_day: 0.3
    parameters:
      efficacy: 0.50
  - name: commercial_curfew
    measure_type: curfew
    area_id: ALL
    start_day: 15
    end_day: 50
    stringency: 0.60
    cost_per_day: 1.8
  - name: surge_icu_beds
    measure_type: surge_beds
    area_id: ALL
    start_day: 18
    end_day: 80
    stringency: 0.50
    cost_per_day: 2.0
    parameters:
      extra_icu_capacity: 15.0

objectives:
  max_deaths: 100
  max_peak_overflow_days: 2
  max_cost_proxy: 600.0

provenance:
  source: "EpiSwarm Scenario Pack"
  status: assumed
  notes: "Graduated intervention response package."
