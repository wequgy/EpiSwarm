name: targeted_containment
horizon_days: 90
scale_agents: 50000
random_seed: 42

seeding:
  area_id: A01
  seed_all_areas: false
  initial_cases_per_area: 25
  seeded_state: I_symp

interventions:
  - name: universal_mask_mandate
    measure_type: mask_mandate
    area_id: ALL
    start_day: 7
    end_day: 60
    stringency: 0.80
    cost_per_day: 0.5
  - name: targeted_school_closure
    measure_type: school_closure
    area_id: ALL
    start_day: 10
    end_day: 45
    stringency: 0.90
    cost_per_day: 1.5
  - name: transit_crowd_reduction
    measure_type: curfew
    area_id: ALL
    start_day: 12
    end_day: 75
    stringency: 0.70
    cost_per_day: 1.0

objectives:
  max_deaths: 120
  max_peak_overflow_days: 3
  max_cost_proxy: 400.0

provenance:
  source: "EpiSwarm Scenario Pack"
  status: assumed
  notes: "Proactive targeted intervention package."
